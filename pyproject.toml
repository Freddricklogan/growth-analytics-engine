[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "growth-engine"
version = "1.0.0"
description = "Attribution and cohort analytics on synthetic event streams: Markov-chain attribution, cohort retention, uplift and CAC/LTV."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Freddrick Logan" }]
dependencies = [
  "numpy>=2.0",
  "typer>=0.12",
]

[project.optional-dependencies]
app = ["streamlit>=1.38"]
dev = [
  "pytest>=8.3",
  "pytest-cov>=5.0",
  "ruff>=0.6",
  "mypy>=1.11",
  "bandit>=1.7",
  "pip-audit>=2.7",
]

[project.scripts]
growth-engine = "growth_engine.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/growth_engine"]

[tool.hatch.build]
include = ["src/growth_engine/**"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "UP", "B", "C4", "DTZ", "S", "SIM", "RUF", "T20", "PTH", "RET", "ARG"]
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "ARG001"]
"src/growth_engine/cli.py" = ["T20"]
"streamlit_app.py" = ["T20"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]
warn_unreachable = true

[[tool.mypy.overrides]]
module = ["streamlit", "streamlit.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
source = ["growth_engine"]
branch = true
omit = ["src/growth_engine/cli.py"]

[tool.coverage.report]
show_missing = true
